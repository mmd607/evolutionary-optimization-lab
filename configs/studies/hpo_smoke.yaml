# HPO framework smoke study (CI): exercises run -> test-eval -> diagnose -> aggregate on the
# bundled breast-cancer data (no download). Tiny search space and budget: NOT a result.
study:
  name: hpo_smoke
  stage: pilot
  output_dir: artifacts/hpo_smoke
  data_dir: data
  problems:
    - name: breast_cancer-hgb
      task: breast_cancer_smoke
      task_type: classification
      target_metric: f1_macro
      objectives: [validation_error]
      model: hist_gradient_boosting
      model_seed: 0
      search_space:
        learning_rate: {type: float, low: 0.05, high: 0.3, log: true}
        max_iter: {type: int, low: 5, high: 30, log: true}
        max_leaf_nodes: {type: int, low: 4, high: 16, log: true}
      split: {strategy: stratified, test_fraction: 0.2, random_seed: 2026}
      cv: {strategy: stratified_kfold, n_splits: 3, random_seed: 2026}
  algorithms:
    - name: random_search
      parameters: {batch_size: 4}
    - name: ga
      parameters: {pop_size: 4}
    - name: optuna_tpe
      parameters: {n_startup_trials: 4}
  budget: {unit: objective_evaluations, max_evaluations: 10}
  seeds: {policy: explicit, values: [11, 23]}
  timeout_seconds: 600
