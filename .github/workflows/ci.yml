name: CI

on:
  push:
    branches: [main, "phase/**", "feature/**", "fix/**", "test/**", "docs/**", "refactor/**", "perf/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-py312.txt

      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -c requirements/constraints-py312.txt -e . --group test --group lint

      - name: Ruff lint
        run: python -m ruff check . --output-format=github

      - name: Ruff format
        run: python -m ruff format --check .

      - name: MyPy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest --cov --cov-report=term-missing

      - name: Validate configs
        shell: bash
        run: python -m evooptlab validate-config configs/*.yaml configs/studies/*.yaml

      - name: Smoke study end-to-end
        shell: bash
        run: |
          root="$RUNNER_TEMP/evooptlab-smoke"
          python -m evooptlab plan configs/studies/smoke.yaml
          python -m evooptlab run configs/studies/smoke.yaml --root "$root"
          python -m evooptlab run configs/studies/smoke.yaml --root "$root" --resume
          python -m evooptlab diagnose configs/studies/smoke.yaml --root "$root"
          python -m evooptlab aggregate configs/studies/smoke.yaml --root "$root"
